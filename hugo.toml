# Site-wide settings. Change baseURL once you know your real address.
baseURL = "https://example.org/"
languageCode = "en-us"
title = "sigmaleph"

[params]
  author = "sigmaleph"
  description = "Writing"

# The links in the top navigation bar.
[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 1
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 2

# Allow raw HTML inside Markdown posts (handy for things like <details> blocks).
[markup.goldmark.renderer]
  unsafe = true

# Only use tags (Hugo also enables "categories" by default).
[taxonomies]
  tag = "tags"
